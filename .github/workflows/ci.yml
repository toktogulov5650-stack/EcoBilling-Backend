name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  ECOBILLING_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=ecobilling_ci;Include Error Detail=false

jobs:
  verify:
    name: Restore, build, test and containers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ecobilling_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore EcoBilling.slnx -warnaserror

      - name: Generate complete v1 migration
        env:
          ECOBILLING_DESIGN_TIME_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=ecobilling_ci;Include Error Detail=false
        run: |
          dotnet tool restore
          dotnet ef migrations add CompleteV1Backend --project src/EcoBilling.Infrastructure --startup-project src/EcoBilling.Infrastructure
          echo "===MIGRATION_FILES_BEGIN==="
          for file in src/EcoBilling.Infrastructure/Migrations/*CompleteV1Backend*.cs src/EcoBilling.Infrastructure/Migrations/EcoBillingDbContextModelSnapshot.cs; do
            echo "===FILE:$file==="
            base64 -w0 "$file"
            echo
            echo "===END_FILE==="
          done
          echo "===MIGRATION_FILES_END==="

      - name: Build Release
        run: dotnet build EcoBilling.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test EcoBilling.slnx --configuration Release --no-build

      - name: Validate Docker Compose
        run: docker compose --env-file deploy/.env.example --file deploy/compose.yml config --quiet

      - name: Build container images
        run: docker compose --env-file deploy/.env.example --file deploy/compose.yml build api worker migrations
