name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore EcoBilling.slnx
      - run: dotnet test EcoBilling.slnx --configuration Release
      - run: dotnet publish src/EcoBilling.Api/EcoBilling.Api.csproj --configuration Release --output artifacts/api
      - run: dotnet publish src/EcoBilling.Worker/EcoBilling.Worker.csproj --configuration Release --output artifacts/worker
      - uses: actions/upload-artifact@v4
        with:
          name: ecobilling-${{ github.ref_name }}
          path: artifacts/
