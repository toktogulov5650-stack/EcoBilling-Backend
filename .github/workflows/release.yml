name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  ECOBILLING_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=ecobilling_release;Include Error Detail=false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ecobilling_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore EcoBilling.slnx -warnaserror

      - name: Build Release
        run: dotnet build EcoBilling.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test EcoBilling.slnx --configuration Release --no-build

      - name: Validate Docker Compose
        run: docker compose --env-file deploy/.env.example --file deploy/compose.yml config --quiet

      - name: Build container images
        run: docker compose --env-file deploy/.env.example --file deploy/compose.yml build api worker migrations postgres

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-api:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-worker:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Migrations image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-migrations:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-postgres:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Prepare SBOM directory
        run: mkdir -p artifacts

      - name: Generate API SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-api:latest
          format: cyclonedx
          output: artifacts/sbom-api.cdx.json
          vuln-type: os,library

      - name: Generate Worker SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-worker:latest
          format: cyclonedx
          output: artifacts/sbom-worker.cdx.json
          vuln-type: os,library

      - name: Generate Migrations SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-migrations:latest
          format: cyclonedx
          output: artifacts/sbom-migrations.cdx.json
          vuln-type: os,library

      - name: Generate PostgreSQL SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecobilling-postgres:latest
          format: cyclonedx
          output: artifacts/sbom-postgres.cdx.json
          vuln-type: os,library

      - name: Publish API
        run: dotnet publish src/EcoBilling.Api/EcoBilling.Api.csproj --configuration Release --no-restore --output artifacts/api

      - name: Publish Worker
        run: dotnet publish src/EcoBilling.Worker/EcoBilling.Worker.csproj --configuration Release --no-restore --output artifacts/worker

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecobilling-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
