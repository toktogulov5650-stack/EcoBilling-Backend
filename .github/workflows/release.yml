name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  ECOBILLING_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=ecobilling_release;Include Error Detail=false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ecobilling_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore EcoBilling.slnx -warnaserror

      - name: Verify formatting
        run: dotnet format EcoBilling.slnx --no-restore --verify-no-changes

      - name: Build Release
        run: dotnet build EcoBilling.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test EcoBilling.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/EcoBilling.Api/EcoBilling.Api.csproj --configuration Release --no-restore --output artifacts/api

      - name: Publish Worker
        run: dotnet publish src/EcoBilling.Worker/EcoBilling.Worker.csproj --configuration Release --no-restore --output artifacts/worker

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecobilling-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
