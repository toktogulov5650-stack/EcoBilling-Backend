services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecobilling
      POSTGRES_USER: ecobilling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecobilling_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecobilling -d ecobilling"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=ecobilling;Username=ecobilling;Password=${POSTGRES_PASSWORD:-ecobilling_dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=ecobilling;Username=ecobilling;Password=${POSTGRES_PASSWORD:-ecobilling_dev}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
